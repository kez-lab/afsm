name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests, API check, graph verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle plugin tests
        run: ./gradlew -p afsm-graph-gradle-plugin test --stacktrace

      - name: Library tests and API check
        run: |
          ./gradlew \
            :afsm-core:test \
            :afsm-graph-ksp:test \
            :afsm-runtime:test \
            :afsm-test:test \
            :afsm-viewmodel:testDebugUnitTest \
            apiCheck \
            --stacktrace

      - name: Sample app tests and graph baseline
        run: |
          ./gradlew \
            :sample-shop:compileDebugKotlin \
            :sample-shop:testDebugUnitTest \
            :sample-shop:verifyAfsmMmd \
            --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            afsm-graph-gradle-plugin/build/reports/tests/**

  consumer-smoke:
    name: Maven Local consumer smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Consumer smoke build
        run: ./scripts/verify-consumer-smoke.sh --stacktrace
