name: 🐛 Bug Report
description: Report a bug, crash, unexpected state transition, or incorrect diagnostic
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: Afsm Version
      description: What version of Afsm are you using? (e.g. 0.1.0)
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Kotlin, AGP, and JDK versions
      placeholder: Kotlin 2.0.21, AGP 8.10.1, JDK 17
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps / Sample Code
      description: Steps or code snippet to reproduce the behavior.
      placeholder: |
        ```kotlin
        val machine = afsmMachine { ... }
        ```
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
